[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irissa-sri"
version = "0.1.1"
description = "Reference implementation of a telemetry/topology-based Spectral Resilience Index (SRI)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
